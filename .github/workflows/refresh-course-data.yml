name: Refresh course data

# Once a month, re-read prerequisites, offerings, and descriptions from the EECS department's
# course pages. If anything changed, open a pull request to review (nothing changes on its own).
# Needs: Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".

on:
  schedule:
    - cron: "0 15 1 * *"  # the 1st of every month
  workflow_dispatch:       # or run it by hand from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: test-key  # the tests fake every Gemini call
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt

      - name: Re-read the EECS course pages
        run: python scripts/update_offerings.py | tee refresh-log.txt

      # pull requests opened by this workflow don't trigger CI, so test here and report in the PR
      - name: Run the tests against the new data
        id: tests
        continue-on-error: true
        run: python -m pytest -q 2>&1 | tail -20 | tee test-log.txt; test ${PIPESTATUS[0]} -eq 0

      - name: Write the pull request description
        run: |
          {
            echo "Monthly refresh of \`backend/offerings.json\` from the [EECS course pages](https://www2.eecs.berkeley.edu/Courses/)."
            echo
            if [ "${{ steps.tests.outcome }}" = "success" ]; then
              echo "✅ All tests pass with the new data."
            else
              echo "❌ **Some tests fail with the new data.** A prerequisite or offering probably changed in a way the planner can't handle yet; check before merging."
            fi
            echo
            echo "Review the changed prerequisites in the diff (the \`prereq_text\` field shows Berkeley's original wording)."
            echo
            echo "<details><summary>Test output</summary>"
            echo
            echo '```'
            cat test-log.txt
            echo '```'
            echo "</details>"
          } > pr-body.md
          rm refresh-log.txt test-log.txt

      - uses: peter-evans/create-pull-request@v8.1.1
        with:
          branch: refresh-course-data
          commit-message: Refresh course data from the EECS course pages
          title: Monthly course data refresh
          body-path: pr-body.md
          add-paths: backend/offerings.json
          delete-branch: true
