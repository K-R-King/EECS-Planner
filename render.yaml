# Render blueprint for the backend (free plan). In Render: New → Blueprint → pick this repo.
# The free plan sleeps after ~15 minutes idle; the first request after that takes up to a minute.
services:
  - type: web
    name: eecs-planner-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /courses
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      # behind Render's proxy, use each visitor's real address (the advisor limit is per visitor)
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false   # Render asks for it during setup
      - key: ALLOWED_ORIGINS
        sync: false   # your Vercel URL, e.g. https://eecs-planner.vercel.app
