# Render blueprint for the backend (free plan). In Render: New → Blueprint → pick this repo.
# The free plan sleeps after ~15 minutes idle; the first request after that takes up to a minute.
services:
  - type: web
    name: eecs-planner-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /courses
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      # the advisor limit is per visitor: read each visitor's address from the header Render's Cloudflare
      # edge sets (not X-Forwarded-For, which visitors can fake)
      - key: CLIENT_IP_HEADER
        value: true-client-ip
      - key: GEMINI_API_KEY
        sync: false   # Render asks for it during setup
      - key: ALLOWED_ORIGINS
        sync: false   # your Vercel URL, e.g. https://eecs-planner.vercel.app
